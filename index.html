<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mohamed Ibrahim — Portfolio</title>
  <meta name="description" content="Graphic design, 3D and brand identity portfolio of Mohamed Ibrahim." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;800&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="home">
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span class="cursor-label"></span></div>
  <div class="loader" aria-hidden="true"><div class="loader-name"></div><div class="loader-bar"><span></span></div></div>

  <header class="nav">
    <a class="nav-logo" href="index.html" data-site="short"></a>
    <nav class="nav-links">
      <a href="#work" data-i18n="work"></a>
      <a href="#about" data-i18n="about"></a>
      <a href="#contact" data-i18n="contact"></a>
    </nav>
    <button class="lang-toggle" type="button" aria-label="Switch language"></button>
  </header>

  <main>
    <section class="hero">
      <div class="hero-media reveal-scale" id="showreel"></div>
      <div class="hero-content">
        <p class="hero-eyebrow"><span class="dot"></span><span data-i18n="available"></span></p>
        <h1 class="hero-title" data-site="name"></h1>
        <div class="hero-rotator" aria-live="polite"><span class="rotator-word"></span></div>
        <p class="hero-intro" data-site="intro"></p>
      </div>
      <a class="hero-scroll" href="#work"><span data-i18n="scroll"></span><i></i></a>
    </section>

    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

    <section class="work" id="work">
      <div class="section-head">
        <h2 class="section-title"><span data-i18n="selectedWork"></span> <sup id="work-count"></sup></h2>
        <div class="filters" id="filters" role="tablist"></div>
      </div>
      <div class="work-grid" id="work-grid"></div>
    </section>

    <section class="about" id="about">
      <div class="about-label" data-i18n="about"></div>
      <p class="about-text reveal" data-site="about"></p>
      <div class="stats" id="stats"></div>
      <div class="services">
        <div class="about-label" data-i18n="services"></div>
        <ol class="services-list" id="services"></ol>
      </div>
    </section>

    <section class="contact" id="contact">
      <p class="about-label" data-i18n="letsTalk"></p>
      <a class="contact-mail" id="contact-mail"></a>
      <ul class="socials" id="socials"></ul>
    </section>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> <span data-site="name"></span></span>
    <button class="to-top" type="button" data-i18n="backTop"></button>
  </footer>

  <div class="lightbox" id="lightbox" hidden><button class="lightbox-close" aria-label="Close">×</button><div class="lightbox-inner"></div></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
